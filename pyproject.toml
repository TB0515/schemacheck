[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "schemacheck"
version = "0.2.0"
description = "Offline linter and fixer for LLM/MCP tool JSON Schemas (OpenAI strict, Gemini, Anthropic)."
keywords = ["mcp", "model-context-protocol", "json-schema", "linter", "openai", "gemini", "anthropic", "function-calling", "tool-calling", "structured-outputs"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/TB0515/schemacheck"
Repository = "https://github.com/TB0515/schemacheck"
Issues = "https://github.com/TB0515/schemacheck/issues"
Documentation = "https://github.com/TB0515/schemacheck/blob/main/docs/rules.md"

[project.scripts]
schemacheck = "schemacheck.cli:main"

[dependency-groups]
dev = ["ruff", "pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/schemacheck"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
