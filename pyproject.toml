[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "schemacheck"
version = "0.1.0"
description = "Offline linter and fixer for LLM/MCP tool JSON Schemas (OpenAI strict, Gemini, Anthropic)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
schemacheck = "schemacheck.cli:main"

[dependency-groups]
dev = ["ruff", "pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/schemacheck"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
